# Runs the isolated Unibet pilot on its own schedule to avoid overlapping cron events.
name: Unibet Pilot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unibet-pilot
  cancel-in-progress: false

env:
  CRON_BASE_URL: ${{ vars.CRON_BASE_URL != '' && vars.CRON_BASE_URL || 'https://evodata.vercel.app' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger isolated Unibet pilot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -L -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_BASE_URL}/api/unibet-pilot/cron")"
          cat "$response_file"
          test "$status" -ge 200
          test "$status" -lt 300
