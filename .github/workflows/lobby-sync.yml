# Refreshes the primary lobby and Unibet recovery data together every ten minutes.
name: Lobby Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lobby-sync
  cancel-in-progress: false

env:
  CRON_BASE_URL: ${{ vars.CRON_BASE_URL != '' && vars.CRON_BASE_URL || 'https://evodata.vercel.app' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Refresh primary lobby
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -L -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_BASE_URL}/api/casinoscores/cron")"
          cat "$response_file"
          test "$status" -ge 200
          test "$status" -lt 300
      - name: Refresh Unibet recovery data
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -L -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_BASE_URL}/api/unibet-pilot/cron")"
          cat "$response_file"
          test "$status" -ge 200
          test "$status" -lt 300
